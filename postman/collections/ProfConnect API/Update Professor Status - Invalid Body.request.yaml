$kind: http-request
name: 'Update Professor Status - Invalid Body'
method: POST
url: '{{base_url}}/api/professors/{{professor_id}}/status'
description: |-
  Negative test: POST with an invalid status value should return 422 Unprocessable Entity.
  FastAPI/Pydantic validates the enum — only "available", "busy", "away" are valid.
order: 10000
headers:
  - key: Content-Type
    value: application/json
  - key: x-api-key
    value: '{{admin_key}}'
body:
  type: json
  content: |-
    {"status": "online"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 422 Unprocessable Entity", function () {
        pm.response.to.have.status(422);
      });

      pm.test("Response has validation detail", function () {
        const json = pm.response.json();
        pm.expect(json.detail).to.be.an("array").and.not.empty;
      });
