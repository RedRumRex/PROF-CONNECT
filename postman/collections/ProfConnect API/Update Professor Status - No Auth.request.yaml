$kind: http-request
name: 'Update Professor Status - No Auth'
method: POST
url: '{{base_url}}/api/professors/{{professor_id}}/status'
description: |-
  Negative test: POST without x-api-key header should return 401 Unauthorized.
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"status": "busy"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401 Unauthorized", function () {
        pm.response.to.have.status(401);
      });

      pm.test("Error detail mentions missing api key", function () {
        const json = pm.response.json();
        pm.expect(json.detail.toLowerCase()).to.include("missing");
      });
